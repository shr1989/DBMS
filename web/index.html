<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3B1319">
    <title>Hotel Management</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Primary">
            <a class="brand" href="#/dashboard">
                <span class="brand__mark" id="brand-mark" aria-hidden="true"></span>
                <span>
                    <span class="brand__name">Hotel Management</span>
                    <span class="brand__tag">Front desk &amp; operations</span>
                </span>
            </a>
            <nav class="nav" id="nav" aria-label="Sections"></nav>
            <div class="sidebar__foot">
                <img class="sprig" src="img/botanical-sprig-light.svg" alt="" aria-hidden="true">
                <p class="sidebar__note">PostgreSQL · Java backend</p>
            </div>
        </aside>

        <div class="main-col">
            <div class="botanical botanical--tl" aria-hidden="true">
                <img src="img/botanical-top-left.svg" alt="">
            </div>

            <div class="topbar">
                <button class="btn btn--ghost btn--sm menu-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">
                    <span id="menu-icon" aria-hidden="true"></span> Menu
                </button>
                <div class="status-pill" id="status" data-state="checking" role="status" aria-live="polite">
                    <span class="status-pill__dot" aria-hidden="true"></span>
                    <span class="status-pill__text" id="status-text">Connecting…</span>
                </div>
            </div>

            <main id="main" tabindex="-1">
                <div class="boot" id="boot">
                    <span class="spinner" aria-hidden="true"></span>
                    <p>Opening the register…</p>
                </div>
                <noscript><div class="state"><h3>JavaScript is required</h3><p>Please enable JavaScript to use the hotel register.</p></div></noscript>
            </main>

            <footer class="footer">
                <div class="footer__rule"></div>
                <p>Hotel Management System · BACSE202 · Shraddha Sidhan 25BDS0110</p>
            </footer>
        </div>
    </div>

    <div class="botanical botanical--br" aria-hidden="true">
        <img src="img/botanical-bottom-right.svg" alt="">
    </div>

    <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
